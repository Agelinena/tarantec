# Tarantec: CI/CD do portfólio.
#
#   Setup → Validação → Build → Deploy
#
# Em pull request roda até o Build (sem publicar). Na main, o Build publica a
# imagem no GHCR e o Deploy registra o que foi para o ar. Quem atualiza o
# servidor é o próprio servidor: ele confere o GHCR de tempos em tempos e
# recria o container se a imagem mudou. Nada daqui entra no servidor, e
# nenhuma chave dele fica no GitHub.
#
# Actions fixadas pelo commit (o Dependabot atualiza): uma tag movida por
# quem invadiu a action não muda o que roda aqui.
name: Pipeline Tarantec

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEM: ghcr.io/agelinena/tarantec

jobs:
  setup:
    name: "🔧 Setup"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Listar arquivos do site
        run: |
          find site -type f | sort
          du -sh site

  validacao:
    name: "✅ Validação"
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verificar index.html
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::site/index.html não encontrado!"
            exit 1
          fi
          echo "Arquivo OK ✅"

      - name: Nada inline (a CSP do nginx bloquearia)
        run: |
          if grep -nE '<script>|<script [^>]*>[^<]|<style|[[:space:]]style=|[[:space:]]on[a-z]+=' site/*.html; then
            echo "::error::script, style ou evento inline no HTML: mova para css/ ou js/"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: HTML válido
        run: npx --yes html-validate@11.21.1 site/index.html site/404.html

      - name: Links e âncoras internos
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --root-dir "${{ github.workspace }}/site" site/index.html site/404.html
          fail: true

  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    needs: validacao
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publicar.outputs.digest }}
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Criar imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tarantec:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Testar o container (como no servidor)
        run: |
          docker run -d --name tarantec-ci --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 18080:8080 tarantec:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/saude && break; sleep 1; done

          falhou=0
          checar() { if eval "$2"; then echo "ok  $1"; else echo "::error::$1"; falhou=1; fi; }
          h=$(curl -sS -D - -o /dev/null http://127.0.0.1:18080/)
          checar "página inicial 200"        '[ "$(curl -s -o /dev/null -w %{http_code} http://127.0.0.1:18080/)" = 200 ]'
          checar "CSP presente"               'grep -qi "^content-security-policy: default-src .none." <<<"$h"'
          checar "nosniff presente"           'grep -qi "^x-content-type-options: nosniff" <<<"$h"'
          checar "versão do nginx escondida"  '! grep -qiE "^server: nginx/" <<<"$h"'
          checar "404 de verdade"             '[ "$(curl -s -o /dev/null -w %{http_code} http://127.0.0.1:18080/nao-existe)" = 404 ]'
          checar "POST recusado (405)"        '[ "$(curl -s -o /dev/null -w %{http_code} -X POST http://127.0.0.1:18080/)" = 405 ]'
          checar "arquivo oculto escondido"   '[ "$(curl -s -o /dev/null -w %{http_code} http://127.0.0.1:18080/.env)" = 404 ]'
          checar "roda sem root"              '[ "$(docker exec tarantec-ci id -u)" != 0 ]'
          docker rm -f tarantec-ci >/dev/null
          exit $falhou

      - name: Varredura de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tarantec:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Entrar no GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar artefato (latest + sha)
        id: publicar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curto="sha-${GITHUB_SHA::7}"
          docker tag tarantec:ci "$IMAGEM:latest"
          docker tag tarantec:ci "$IMAGEM:$curto"
          docker push -q "$IMAGEM:$curto"
          docker push -q "$IMAGEM:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGEM:latest")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: "🚀 Deploy"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - name: Registrar o deploy
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          {
            echo "## 🚀 Publicado"
            echo
            echo "- Imagem: \`$DIGEST\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo
            echo "O servidor confere o GHCR a cada 5 minutos e recria o container"
            echo "quando a imagem muda (pull: nada daqui acessa o servidor)."
          } >> "$GITHUB_STEP_SUMMARY"
