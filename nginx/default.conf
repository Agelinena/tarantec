# Tarantec: site estático. Só GET/HEAD, sem listagem de pastas, cabeçalhos de
# segurança em toda resposta. O TLS fica no proxy da frente.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;
    charset utf-8;
    client_max_body_size 1k;

    # CSP: tudo vem do próprio site (fontes inclusive); nada inline.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Arquivos ocultos (.git, .env) nunca, mesmo que entrem na imagem por engano.
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
        # HTML, CSS e JS sem hash no nome: o navegador revalida (ETag) e o
        # deploy aparece na hora.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Fontes e imagens mudam pouco: cache de um dia.
    location ~* \.(woff2|svg)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Healthcheck do container.
    location = /saude { access_log off; default_type text/plain; return 200 "ok\n"; }
}
